name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (the same installer users run)
        run: python install.py

      - name: The command works from Git Bash (what Claude Code uses on Windows)
        shell: bash
        run: |
          "$HOME/.local/bin/runlog" --help | head -3
          eval "$(cat "$HOME/.config/runlog/command.txt") --help" | head -1

      - name: The command works from cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: '"%USERPROFILE%\.local\bin\runlog.cmd" --help'

      - name: Tests (end to end against a fake Garmin, plus the lap detector)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests
